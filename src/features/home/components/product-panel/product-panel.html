<section
class="panel product-panel"
[style.--glow]="product.bgColor"
[id]="'product-' + product.id">

    <div class="product-content">

        <div class="product-info">

            <span>
                NOVA COLLECTION
            </span>

            <h2>
                {{ product.name }}
            </h2>

            <p>
                {{ product.description }}
            </p>

            <div class="product-price">
                {{ product.price }}€
            </div>

            <div class="product-actions">

                <button 
                    class="primary-btn"
                    (click)="addToCart()">
                Add to Cart
                </button>

                <button 
                    class="secondary-btn"
                    (click)="openDetails()">
                Details
                </button>

            </div>

        </div>

        <div class="product-image">

            <img
                [src]="product.image"
                [alt]="product.name"
                loading="lazy">

        </div>

    </div>

    @if (showDetails) {

        <div
            class="modal-overlay"
            (click)="closeDetails()">

            <div
            class="product-modal"
            (click)="$event.stopPropagation()">

            <button
                class="close-btn"
                (click)="closeDetails()">

                ✕

            </button>

            <img
                [src]="product.image"
                [alt]="product.name">

            <h2>{{ product.name }}</h2>

            <p>{{ product.details }}</p>

            <ul>
                @for(feature of product.features; track feature) {
                    <li>{{ feature }}</li>
                }
            </ul>

            <button
                class="primary-btn"
                (click)="addToCart()">

                Add to Cart

            </button>

            </div>

        </div>

    }

</section>
